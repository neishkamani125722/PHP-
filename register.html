<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friendzone University - Registration</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-content">
        <img src="logo.png" alt="Logo">
        <h1>Friendzone University</h1>
    </div>
</header>

<div class="container">

    <h2>Student Registration</h2>

    <form id="registerForm">

        <input
            type="text"
            id="regUsername"
            placeholder="Enter Username"
            required>

        <input
            type="email"
            id="regEmail"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            id="regPassword"
            placeholder="Enter Password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

    <a href="login.html">
        Already Registered? Login
    </a>

</div>

<div id="popup" class="popup">

    <div class="popup-content">

        <img src="logo.png" alt="Logo">

        <h2>Friendzone University</h2>

        <p id="popupMessage"></p>

        <button onclick="closePopup()">
            OK
        </button>

    </div>

</div>

<footer>
    Made By Neish kamani 
</footer>

<script src="script.js"></script>

</body>
</html>
